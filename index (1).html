<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>hello :)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 90'%3E%3Cpath fill='%23e5173f' d='M50 85C20 60 2 40 2 25 2 10 14 2 27 2c10 0 19 6 23 14C54 8 63 2 73 2c13 0 25 8 25 23 0 15-18 35-48 60z'/%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f5f6fa;
    --ink: #2a2a3c;
    --heart: #e5173f;
    --type: "American Typewriter", "Courier Prime", "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--type);
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  /* Typed text */
  #stage {
    width: min(100%, 36rem);
    margin: 0 auto;
    padding: 30vh 1.5rem 2rem;
    padding-top: 30dvh;
    text-align: center;
  }
  .line {
    min-height: 1.5em;
    margin: 0 0 1.1em;
    font-size: clamp(1.25rem, 4.8vw, 2rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .line.long { font-size: clamp(1.1rem, 4.2vw, 1.6rem); line-height: 1.65; }
  .cursor {
    display: inline-block;
    width: 0.08em;
    height: 1.1em;
    margin-left: 0.12em;
    vertical-align: -0.18em;
    background: var(--ink);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Heart */
  #heartWrap {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 1.2s ease;
  }
  #heartWrap.show { display: flex; }
  #heartWrap.fade { opacity: 0; }
  #heart {
    width: min(60vw, 18rem);
    height: auto;
    overflow: visible;
    transform-origin: 50% 55%;
  }
  #heart path {
    fill: var(--heart);
    fill-opacity: 0;
    stroke: var(--heart);
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
  }
  #heart.draw path {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 2.6s ease-in-out;
  }
  #heart.fill path {
    fill-opacity: 1;
    transition: stroke-dashoffset 2.6s ease-in-out, fill-opacity 1.2s ease;
  }
  #heart.beat { animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    12% { transform: scale(1.07); }
    24% { transform: scale(1); }
    36% { transform: scale(1.05); }
    50% { transform: scale(1); }
  }

  /* Restart button */
  #restartWrap {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  #restartWrap.show { display: flex; }
  #restart {
    font: inherit;
    font-size: clamp(1.05rem, 4vw, 1.3rem);
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 6px;
    padding: 0.9em 1.8em;
    min-height: 3rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1s ease, background-color 0.2s ease, color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #restartWrap.show #restart.visible { opacity: 1; }
  #restart:hover { background: var(--ink); color: var(--paper); }
  #restart:focus-visible { outline: 3px solid var(--heart); outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    #heart.beat { animation: none; }
    #heart.draw path, #heart.fill path { transition-duration: 0.01s; }
  }
</style>
</head>
<body>

<main id="stage" aria-live="polite"></main>

<div id="heartWrap" aria-hidden="true">
  <svg id="heart" viewBox="0 0 100 90" role="img" aria-label="A red heart">
    <path pathLength="1" d="M50 85C20 60 2 40 2 25 2 10 14 2 27 2c10 0 19 6 23 14C54 8 63 2 73 2c13 0 25 8 25 23 0 15-18 35-48 60z"/>
  </svg>
</div>

<div id="restartWrap">
  <button id="restart" type="button">play it again</button>
</div>

<script>
(function () {
  "use strict";

  /* ---- Your words (edit these) ---- */
  var LINE_1 = "hello :)";
  var LINE_2 = "hold up, there is no need for you to type.";
  var LINE_3 = "just sit back and let this do the talking";
  var MESSAGE = "i just wanted to say I love you jack, and if you ever forget, just please open this page up and let me remind you like how i am";
  var HEART_SECONDS = 10;

  var stage = document.getElementById("stage");
  var heartWrap = document.getElementById("heartWrap");
  var heart = document.getElementById("heart");
  var restartWrap = document.getElementById("restartWrap");
  var restart = document.getElementById("restart");

  var cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.setAttribute("aria-hidden", "true");

  var runId = 0;

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  function newLine(extraClass) {
    var line = document.createElement("div");
    line.className = "line" + (extraClass ? " " + extraClass : "");
    var t = document.createElement("span");
    line.appendChild(t);
    line.appendChild(cursor);
    stage.appendChild(line);
    return t;
  }

  async function type(span, text, speed, id) {
    for (var i = 0; i < text.length; i++) {
      if (id !== runId) return;
      span.textContent += text[i];
      var ch = text[i];
      var wait = speed * (0.7 + Math.random() * 0.6);
      if (ch === "," || ch === ".") wait += speed * 3;
      await sleep(wait);
    }
  }

  async function eraseAll(id) {
    var spans = Array.prototype.slice.call(stage.querySelectorAll(".line > span"));
    var total = spans.reduce(function (n, s) { return n + s.textContent.length; }, 0);
    var step = Math.max(1, Math.ceil(total / 55));
    var idx = spans.length - 1;
    while (idx >= 0) {
      if (id !== runId) return;
      var s = spans[idx];
      if (s.textContent.length === 0) { idx--; continue; }
      s.textContent = s.textContent.slice(0, Math.max(0, s.textContent.length - step));
      await sleep(16);
    }
    stage.innerHTML = "";
  }

  function resetHeart() {
    heart.setAttribute("class", "");
    heartWrap.className = "";
    void heart.getBoundingClientRect(); // restart transitions
  }

  async function showHeart(id) {
    resetHeart();
    heartWrap.classList.add("show");
    void heart.getBoundingClientRect();
    heart.classList.add("draw");
    await sleep(2400);
    if (id !== runId) return;
    heart.classList.add("fill");
    await sleep(1300);
    if (id !== runId) return;
    heart.classList.add("beat");
    await sleep(HEART_SECONDS * 1000); // 10 seconds with the heart fully formed
    if (id !== runId) return;
    heartWrap.classList.add("fade");
    await sleep(1300);
    heartWrap.className = "";
    heart.setAttribute("class", "");
  }

  async function play() {
    var id = ++runId;
    restart.classList.remove("visible");
    restartWrap.classList.remove("show");
    stage.innerHTML = "";
    stage.style.display = "";
    resetHeart();

    await sleep(900);
    if (id !== runId) return;

    // 1–3: typed lines, one after another
    var t1 = newLine();
    await type(t1, LINE_1, 130, id);
    await sleep(1100);
    var t2 = newLine();
    await type(t2, LINE_2, 75, id);
    await sleep(1100);
    var t3 = newLine();
    await type(t3, LINE_3, 75, id);
    await sleep(1600);
    if (id !== runId) return;

    // 4: erase everything fast
    await eraseAll(id);
    await sleep(900);
    if (id !== runId) return;

    // 5: the message on a blank page
    var tm = newLine("long");
    await type(tm, MESSAGE, 62, id);
    await sleep(2500);
    if (id !== runId) return;

    // 6: erase fast again
    await eraseAll(id);
    await sleep(700);
    if (id !== runId) return;

    // 7: heart forms, stays 10 seconds
    await showHeart(id);
    if (id !== runId) return;

    // 8: blank page, then the restart button
    await sleep(1200);
    if (id !== runId) return;
    restartWrap.classList.add("show");
    void restart.getBoundingClientRect();
    restart.classList.add("visible");
    restart.focus({ preventScroll: true });
  }

  restart.addEventListener("click", play);
  play();
})();
</script>
</body>
</html>
